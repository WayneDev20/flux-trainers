name: Build & Push Trainer Images

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'flux-lora-trainer/**'
      - 'flux-dora-trainer/**'
      - 'flux-dreambooth-trainer/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: flux-lora-trainer
            name: flux-lora-trainer
          - context: flux-dora-trainer
            name: flux-dora-trainer
          - context: flux-dreambooth-trainer
            name: flux-dreambooth-trainer

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase image name
        id: img
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=ghcr.io/${OWNER}/${{ matrix.name }}:latest" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.context }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.img.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.context }}
          cache-to: type=gha,mode=max,scope=${{ matrix.context }}

  serverless:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase image names
        id: img
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "base=ghcr.io/${OWNER}/flux-lora-trainer:latest" >> $GITHUB_OUTPUT
          echo "tag_v1=ghcr.io/${OWNER}/flux-lora-trainer-runpod:v1" >> $GITHUB_OUTPUT
          echo "tag_sha=ghcr.io/${OWNER}/flux-lora-trainer-runpod:sha-${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "sha_short=${SHA_SHORT}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push serverless image
        uses: docker/build-push-action@v5
        with:
          context: flux-lora-trainer
          file: flux-lora-trainer/serverless/Dockerfile.runpod
          platforms: linux/amd64
          push: true
          build-args: |
            BASE_IMAGE=${{ steps.img.outputs.base }}
            GIT_SHA=${{ steps.img.outputs.sha_short }}
            FLUX_WEIGHTS_VERSION=v1
          tags: |
            ${{ steps.img.outputs.tag_v1 }}
            ${{ steps.img.outputs.tag_sha }}
          cache-from: type=gha,scope=flux-lora-trainer-runpod
          cache-to: type=gha,mode=max,scope=flux-lora-trainer-runpod
